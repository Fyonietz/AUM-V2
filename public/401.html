<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>401 Unauthorized</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom right, #000000, #1a1a1a, #2a2a2a);
      color: white;
      animation: fadeIn 1s ease;
    }

    .container {
      text-align: center;
      padding: 3rem 2rem;
      border-radius: 2rem;
      background: linear-gradient(to bottom, #111111, #000000, #111111);
      border: 2px solid #333;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 0 30px rgba(0,0,0,0.7);
      animation: fadeIn 1s ease;
    }

    .icon-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(to bottom right, #0f172a, #000000, #7f1d1d);
      margin-bottom: 1rem;
      animation: pulse 2s infinite;
    }

    .icon-wrapper svg {
      width: 40px;
      height: 40px;
      color: #3b82f6;
      filter: drop-shadow(0 0 12px #3b82f6) drop-shadow(0 0 24px #ef4444);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.25rem;
      color: #93c5fd;
      margin-bottom: 1.5rem;
    }

    p span {
      font-size: 1rem;
      color: #a1a1aa;
    }

    .error-code {
      display: inline-block;
      padding: 0.5rem 1rem;
      border-radius: 1rem;
      background-color: #111;
      color: #3b82f6;
      font-weight: bold;
      border: 1px solid #333;
      user-select: none;
    }

    /* Animations */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrapper">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 17v.01M6.938 15.016A7.002 7.002 0 0112 5a7.002 7.002 0 015.062 10.016M17 13v-2a5 5 0 00-10 0v2m10 0a2 2 0 11-4 0 2 2 0 014 0z"/>
      </svg>
    </div>
    <h1>401 Unauthorized</h1>
    <p>
      Oops! Kamu tidak punya akses ke halaman ini.<br />
      <span>Silakan login dengan akun yang benar.</span>
    </p>
    <div>
      <span class="error-code">Error Code: 401</span>
    </div>
  </div>

  <script>
    // Wait 1.5 seconds then redirect to /login
    setTimeout(() => {
      window.location.href = '/login';
    }, 1500);
  </script>
</body>
</html>
