<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUM - Login</title>
  <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/Fyonietz/TEFA-ASSETS/refs/heads/main/logoRounded.ico">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-50 to-blue-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md" role="main">
    <!-- Login Card -->
    <section class="bg-white rounded-3xl shadow-2xl p-8 md:p-12">
      <!-- Logo -->
      <div class="flex justify-center mb-8">
        <img 
          src="https://raw.githubusercontent.com/Fyonietz/TEFA-ASSETS/refs/heads/main/logoRounded.ico" 
          alt="Binary Coding Space Logo" 
          class="w-20 h-20 object-contain"
        >
      </div>

      <!-- Welcome Text -->
      <header class="text-center mb-4">
        <h1 class="text-3xl md:text-4xl font-bold text-gray-900 mb-2">Welcome</h1>
        <p class="text-gray-500 text-sm md:text-base">Sign in to your account</p>
      </header>

      <!-- Result Message -->
      <div id="loginMessage" role="alert" class="text-center text-sm md:text-base mb-4 text-red-500"></div>

      <!-- Form -->
      <form id="loginForm" class="space-y-6" novalidate>
        <!-- Username Field -->
        <div>
          <label for="username" class="block text-gray-900 font-semibold mb-2 text-sm md:text-base">Username</label>
          <div class="relative">
            <input 
              type="text" 
              id="username"
              name="username"
              placeholder="Enter your username"
              aria-required="true"
              class="w-full px-4 py-3 md:py-4 pr-12 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 transition-colors text-sm md:text-base"
            >
            <div class="absolute right-4 top-1/2 transform -translate-y-1/2">
              <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
          </div>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-gray-900 font-semibold mb-2 text-sm md:text-base">Password</label>
          <div class="relative">
            <input 
              type="password" 
              id="password"
              name="password"
              placeholder="Enter your password"
              aria-required="true"
              class="w-full px-4 py-3 md:py-4 pr-12 bg-gray-50 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-blue-500 transition-colors text-sm md:text-base"
            >
            <button 
              type="button"
              onclick="togglePassword()"
              aria-label="Toggle password visibility"
              class="absolute right-4 top-1/2 transform -translate-y-1/2 focus:outline-none"
            >
              <svg id="eyeIcon" class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- Sign In Button -->
        <button 
          type="submit"
          class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white font-semibold py-3 md:py-4 rounded-xl hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 text-sm md:text-base"
        >
          Sign In
        </button>
      </form>

      <!-- Footer -->
      <footer class="mt-8 pt-6 border-t border-gray-200">
        <p class="text-center text-blue-600 font-semibold text-sm md:text-base">
          TEFA RPL • Binary Coding Space
        </p>
      </footer>
    </section>
  </main>

  <script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>';
      } else {
        passwordInput.type = 'password';
        eyeIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
      }
    }

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const messageDiv = document.getElementById('loginMessage');
      messageDiv.textContent = '';
      if (!username || !password) {
    messageDiv.textContent = 'Please enter both username and password.';
    return; // Stop further execution if either is empty
}
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama: username, password: password }),
          credentials: 'same-origin'
        });

        if (!response.ok) {
          if (response.status === 404) throw new Error('Your username or password is wrong.');
          else if (response.status === 500) throw new Error('The server encountered an error.');
          else throw new Error('Server error. Please try again later.');
        }

        const data = await response.json();
        if (data.success) {
          messageDiv.classList.remove('text-red-500');
          messageDiv.classList.add('text-green-500');
          messageDiv.textContent = 'Login successful! Redirecting...';
          setTimeout(() => window.location.href = data.redirect, 1000);
        } else {
          messageDiv.classList.remove('text-green-500');
          messageDiv.classList.add('text-red-500');
          messageDiv.textContent = 'Your username or password is wrong.';
        }
      } catch (err) {
        messageDiv.classList.remove('text-green-500');
        messageDiv.classList.add('text-red-500');
        messageDiv.textContent = err.message;
        console.error(err);
      }
    });
  </script>
</body>
</html>
